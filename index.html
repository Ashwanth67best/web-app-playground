<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Premium Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="split-container">

        <!-- Left Side: Branding and Quotes -->
        <div class="left-panel">
            <div class="logo-container">
                <img src="nexus_logo.png" alt="Nexus Logo" class="logo-img">
            </div>

            <div class="quote-center">
                <span class="quote-icon">“</span>
                <h1 class="heading">Unlock Your <span class="highlight">Potential</span></h1>
                <p class="quote-text">"The secret of getting ahead is getting started. The complex is made simple one step at a time."</p>
                <p class="author">— Mark Twain</p>
            </div>

            <div class="footer-left">
                <!-- Left blank for clean spacing -->
            </div>
        </div>

        <!-- Right Side: Clean Login Form -->
        <div class="right-panel">
            <div class="login-card">
                <h2>Account Authorization</h2>
                <p class="subtitle">Please sign in to access your secure portal dashboard.</p>

                <form>
                    <div class="input-group">
                        <label for="username">Username or Email</label>
                        <input type="email" id="username" placeholder="Enter your username..." required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="login-btn">LOGIN &rarr;</button>
                </form>
            </div>

            <div class="copyright">
                Copyright &copy; 1998, 2026. All rights reserved.
            </div>
        </div>

    </div>

</body>
</html>
